[mihomo-go]
mihomo-core = mihomo.exe
config-file = config.yaml
; Current TUN state: "on" or "off" (written automatically)
tun-start-mode = off
; Current system proxy state: 1 or 0 (written automatically)
system-proxy-auto = 0
; Selector menu layout: "auto", "flat" or "nested"
selector-menu-layout = auto
